[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-accessory-finder"
version = "1.0.16"
description = "Automation tooling for test-accessory-finder."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Kris Armstrong" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.15.17",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["iperf_discovery"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--maxfail=1 --disable-warnings"
pythonpath = ["src"]
